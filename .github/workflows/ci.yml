name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Realm.sln

      - name: Build
        run: dotnet build Realm.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test Realm.Ecs.Tests\Realm.Ecs.Tests.csproj --configuration Debug --no-build
